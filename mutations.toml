[[control]]
id = "ga-inert-fixture-atomic-publication"
guards = "Actor birth and ready files expose only a complete old record or absence until the new JSON is closed and renamed."
file = "packages/e2e-tests/docker/inert-fixture.ts"
old = '''  const temporary = `${path}.${process.pid}.${randomUUID()}.tmp`
  let file: number | undefined
  try {
    const bytes = Buffer.from(JSON.stringify(value))
    const middle = Math.floor(bytes.length / 2)
    file = fs.openSync(temporary, 'wx')
    fs.writeFileSync(file, bytes.subarray(0, middle))
    await afterHalfWrite?.()
    fs.writeFileSync(file, bytes.subarray(middle))
    // Rename is atomically visible to other processes on this running system.
    // Fsync only adds power-loss durability, which a test fixture does not need.
    fs.closeSync(file)
    file = undefined
    fs.renameSync(temporary, path)'''
new = '''  const temporary = path // NON-VACUITY BREAK: write directly to the visible final path.
  let file: number | undefined
  try {
    const bytes = Buffer.from(JSON.stringify(value))
    const middle = Math.floor(bytes.length / 2)
    file = fs.openSync(temporary, 'w')
    fs.writeFileSync(file, bytes.subarray(0, middle))
    await afterHalfWrite?.()
    fs.writeFileSync(file, bytes.subarray(middle))
    fs.closeSync(file)
    file = undefined'''
test_file = "packages/e2e-tests/docker/ga-contract-inputs.test.ts"
list_command = ["bun", "scripts/list-bun-tests.mjs", "--cwd", ".", "packages/e2e-tests/docker/ga-contract-inputs.test.ts", "-t", "{test}"]
runner = "command"
command = ["bash", "-c", "bun run --cwd packages/core build && env -u GA_NATIVE_JOB_TEST_PROFILE bun test --isolate packages/e2e-tests/docker/ga-contract-inputs.test.ts -t \"$1\"", "--", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^actor\sfixture\spublication\snever\sexposes\struncated\sJSON\sbefore\srename$']

