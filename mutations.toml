# Standing mutation proofs for Antigravity's core, OpenCode and Pi adapters.
# Each row earns its place by guarding a silent, costly failure: leaking account
# identity, reading the wrong credential source, doing local work during vault
# custody, serving an unmigrated pool, fabricating quota age, or breaking a wire
# contract. It pairs one exact, single-occurrence production replacement with
# one exact Bun test that must pass normally and fail under NON-VACUITY BREAK.
# ckdev-mutate validates anchors and test names, runs the green control before
# the break, checks the named red test, then restores the original bytes.
#
# Commands rebuild core for every run because adapters import emitted core.
# Migration tests use the root test script's public-consumer preparation wrapper
# and its owned temporary roots. Anchored selectors encode whitespace as \s and
# escape regex punctuation; an empty selection is not a mutation proof.
#
# Windows migration syncFile access (O_RDWR rather than O_RDONLY) has no
# Linux-runnable behavioral test of the Windows branch. It is deliberately not
# catalogued here; .github/workflows/windows-migration.yml remains its platform gate.

[[control]]
id = "native-inert-record-rejects-failed-gate"
guards = "A failed native-inert gate cannot mint a release record."
file = "scripts/native-inert-result.ts"
old = "  if (result.pass !== true) throw new Error('native-inert gate did not pass')"
new = "  // NON-VACUITY BREAK: accept a failed gate result."
test_file = "test/native-inert-gate.test.ts"
list_command = ["bun", "scripts/list-bun-tests.mjs", "--cwd", ".", "test/native-inert-gate.test.ts", "-t", "{test}"]
runner = "command"
command = ["bun", "test", "--isolate", "test/native-inert-gate.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^native-inert\srecord\swriter\srejects\spass\sfalse$']

