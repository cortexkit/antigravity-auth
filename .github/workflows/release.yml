name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without leading v"
        required: true
      ref:
        description: "Git ref to publish from, such as v1.7.0"
        required: false

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Package installation tests build an older commit for comparison;
          # a shallow checkout cannot provide that commit to git archive.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.12.0.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test TUI
        run: bun run --cwd packages/opencode smoke:tui

      - name: Test
        run: bun run test

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Run OpenCode 2 E2E tests in a network-isolated container
        run: bun run test:e2e:opencode-v2

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

  rpc-runtime-matrix:
    name: RPC runtime matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Each runtime is installed in turn; its executable path is recorded
      # before the next setup step changes PATH. Bun 1.3.14 is copied aside
      # because a later setup-bun step may replace the same binary.
      - name: Setup Node.js 20.0.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.0.0

      - name: Record Node.js 20.0.0
        run: echo "NODE20=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0

      - name: Record Node.js 24.16.0
        run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Record Bun 1.3.14
        run: |
          mkdir -p "$RUNNER_TEMP/bun-1.3.14"
          cp "$(command -v bun)" "$RUNNER_TEMP/bun-1.3.14/bun"
          echo "BUN13=$RUNNER_TEMP/bun-1.3.14/bun" >> "$GITHUB_ENV"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Record Bun 1.4.2
        run: echo "BUN14=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.12.0.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run RPC contracts on all four runtimes
        run: bun run test:rpc:matrix

  publish-npm:
    name: Publish ${{ matrix.package }} to npm
    runs-on: ubuntu-latest
    needs: [test, rpc-runtime-matrix]
    strategy:
      fail-fast: false
      # Publish core first so dependents can resolve the pinned version.
      max-parallel: 1
      matrix:
        include:
          - package: "@cortexkit/antigravity-auth-core"
            workspace: "@cortexkit/antigravity-auth-core"
          - package: "@cortexkit/opencode-antigravity-auth"
            workspace: "@cortexkit/opencode-antigravity-auth"
          - package: "@cortexkit/pi-antigravity-auth"
            workspace: "@cortexkit/pi-antigravity-auth"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Ensure latest npm (for trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.12.0.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Resolve release version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync version
        run: node scripts/version-sync.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        run: bun run build

      - name: Check whether package version is already published
        id: published
        run: |
          if npm view "${{ matrix.package }}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.package }}@${{ steps.version.outputs.version }} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Uses npm Trusted Publishing (OIDC) configured on npmjs.com.
      # Each package runs in a separate matrix job so npm obtains a package-scoped
      # OIDC publish token for that package instead of reusing the previous one.
      - name: Publish package to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --workspace "${{ matrix.workspace }}" --access public --provenance

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, rpc-runtime-matrix, publish-npm]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
