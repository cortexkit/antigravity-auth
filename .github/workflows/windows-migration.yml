name: Windows account migration and vault
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  # Verification branches run it too, so Windows-affecting changes are proven
  # before they reach main.
  push:
    branches: [main, 'verify/**', 'windows-verify/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  vault:
    name: Vault enrollment and served request (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen dependencies and build the product
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun packages/opencode/scripts/embed-common-auth.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/core build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/opencode build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $externals = bun -e "import { BUNDLE_EXTERNALS } from './packages/opencode/scripts/build-tui.ts'; for (const name of BUNDLE_EXTERNALS) console.log('--external:' + name)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/opencode esbuild ../../test/windows-vault/product-entry.mjs --bundle --platform=node --format=esm --sourcemap @externals --outfile=dist/windows-vault-product.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/opencode esbuild ../../test/windows-pi-preflight/product-entry.mjs --bundle --platform=node --format=esm --sourcemap @externals --outfile=dist/windows-pi-preflight-product.mjs
          exit $LASTEXITCODE
      - name: Enroll, check the token DACL, and serve one vault request
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE "agy-vault-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $env:RUNNER_TEMP 'agy-vault-evidence'
          "AGY_VAULT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_VAULT_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node --experimental-import-meta-resolve test/windows-vault/verify.mjs $root $evidence
          exit $LASTEXITCODE
      # The one-time move of the vault files out of OpenCode's config folder:
      # the moved token's folder must pass the private-path check the token
      # writer runs, and a non-private destination must keep the old layout.
      - name: Move the vault files to the state home and check the moved token's folder is private
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE "agy-layout-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "AGY_LAYOUT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node --experimental-import-meta-resolve test/windows-vault/layout-move.mjs $root
          exit $LASTEXITCODE
      - name: Run the vault layout move tests
        shell: pwsh
        run: |
          bun test packages/opencode/src/runtime-layout.test.ts
          exit $LASTEXITCODE
      - name: Verify Pi setup privacy repairs and dry-run isolation
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'agy-pi-preflight-evidence\result.json'
          "AGY_PI_PREFLIGHT_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node test/windows-pi-preflight/verify.mjs $evidence
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pi-preflight-${{ matrix.os }}
          path: ${{ env.AGY_PI_PREFLIGHT_EVIDENCE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-vault-${{ matrix.os }}
          path: ${{ env.AGY_VAULT_EVIDENCE }}
          if-no-files-found: error
      - name: Remove the synthetic vault profile
        if: always()
        shell: pwsh
        run: |
          if ($env:AGY_VAULT_ROOT -and (Test-Path $env:AGY_VAULT_ROOT)) {
            Remove-Item -Recurse -Force $env:AGY_VAULT_ROOT
          }
          if ($env:AGY_LAYOUT_ROOT -and (Test-Path $env:AGY_LAYOUT_ROOT)) {
            Remove-Item -Recurse -Force $env:AGY_LAYOUT_ROOT
          }
  migration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen dependencies and build the candidate migration CLI
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/core build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $externals = bun -e "import { BUNDLE_EXTERNALS } from './packages/opencode/scripts/build-tui.ts'; for (const name of BUNDLE_EXTERNALS) console.log('--external:' + name)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd packages/opencode esbuild src/cli.ts --bundle --platform=node --format=esm @externals --outfile=dist/windows-migration-cli.mjs
          exit $LASTEXITCODE
      - name: Acquire the released regression baseline
        shell: pwsh
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP 'agy-migration-baseline'
          New-Item -ItemType Directory -Path $consumer | Out-Null
          Set-Location $consumer
          '{"name":"owned-migration-baseline","private":true}' | Set-Content package.json
          npm view '@cortexkit/opencode-antigravity-auth@3.0.0' --json | Set-Content registry-opencode.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm view '@cortexkit/antigravity-auth-core@3.0.0' --json | Set-Content registry-core.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install '@cortexkit/opencode-antigravity-auth@3.0.0' --ignore-scripts --no-audit --no-fund --cache "$env:RUNNER_TEMP/agy-migration-cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'); for(const file of ['registry-opencode.json','registry-core.json']) {const data=JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,'')); if(data.version!=='3.0.0'||data.gitHead!=='f39bc1ba7201d5ac52d69b3f970d9905829d55f9')throw Error('Released baseline identity mismatch');}"
          exit $LASTEXITCODE
      - name: Verify safe migration and unsafe refusal over the released leftovers
        shell: pwsh
        run: |
          $safe = Join-Path $env:USERPROFILE 'agy-migration-evidence-safe'
          $unsafe = Join-Path $env:RUNNER_TEMP 'agy-migration-evidence-unsafe'
          "AGY_SAFE_ROOT=$safe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGY_UNSAFE_ROOT=$unsafe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node test/windows-migration/verify.mjs $safe "$env:RUNNER_TEMP/agy-migration-baseline" packages/opencode/dist/windows-migration-cli.mjs safe
          $safeExit = $LASTEXITCODE
          node test/windows-migration/verify.mjs $unsafe "$env:RUNNER_TEMP/agy-migration-baseline" packages/opencode/dist/windows-migration-cli.mjs unsafe
          $unsafeExit = $LASTEXITCODE
          if ($safeExit -ne 0) { exit $safeExit }
          exit $unsafeExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-migration-safe-${{ matrix.os }}
          path: ${{ env.AGY_SAFE_ROOT }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-migration-unsafe-${{ matrix.os }}
          path: ${{ env.AGY_UNSAFE_ROOT }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-migration-baseline-${{ matrix.os }}
          path: ${{ runner.temp }}/agy-migration-baseline/registry-*.json
          if-no-files-found: error
      - name: Clean up both synthetic profiles after artifact upload
        if: always()
        shell: pwsh
        run: |
          foreach ($root in @($env:AGY_SAFE_ROOT, $env:AGY_UNSAFE_ROOT)) {
            if ($root) {
              $profile = Join-Path $root 'profile'
              if (Test-Path $profile) { Remove-Item -Recurse -Force $profile }
            }
          }
