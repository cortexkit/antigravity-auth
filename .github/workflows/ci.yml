name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.11.6.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test TUI
        run: bun run --cwd packages/opencode smoke:tui

      - name: Run tests
        run: bun run test

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Run OpenCode 2 E2E tests in a network-isolated container
        run: bun run test:e2e:opencode-v2

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

  rpc-runtime-matrix:
    name: RPC runtime matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Each runtime is installed in turn; its executable path is recorded
      # before the next setup step changes PATH. Bun 1.3.14 is copied aside
      # because a later setup-bun step may replace the same binary.
      - name: Setup Node.js 20.0.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.0.0

      - name: Record Node.js 20.0.0
        run: echo "NODE20=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0

      - name: Record Node.js 24.16.0
        run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Record Bun 1.3.14
        run: |
          mkdir -p "$RUNNER_TEMP/bun-1.3.14"
          cp "$(command -v bun)" "$RUNNER_TEMP/bun-1.3.14/bun"
          echo "BUN13=$RUNNER_TEMP/bun-1.3.14/bun" >> "$GITHUB_ENV"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Record Bun 1.4.2
        run: echo "BUN14=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.11.6.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run RPC contracts on all four runtimes
        run: bun run test:rpc:matrix
