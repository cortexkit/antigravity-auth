name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          test -f tools/common-auth-build/inputs/cortexkit-common-auth-0.9.4.tgz
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test TUI
        run: bun run --cwd packages/opencode smoke:tui

      - name: Smoke test packed OpenCode 2 adapter
        run: bun run smoke:opencode-v2

      - name: Run tests
        run: bun run test

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Run OpenCode 2 E2E tests in a network-isolated container
        run: bun run test:e2e:opencode-v2

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint
