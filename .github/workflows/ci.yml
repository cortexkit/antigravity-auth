name: CI

on:
  push:
    branches: [main, 'verify/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  # The ckdev-mutate runner that replays mutations.toml (cortexkit/commons,
  # crate cortexkit-mutate 0.12.1), pinned so a runner change never alters CI
  # unannounced.
  CKDEV_MUTATE_REV: 9d6b663dac487bb982c7bfd18a96eee2292164ad

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Package installation tests build an older commit for comparison;
          # a shallow checkout cannot provide that commit to git archive.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          bun packages/opencode/scripts/embed-common-auth.ts --check
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test TUI
        run: bun run --cwd packages/opencode smoke:tui

      - name: Run tests
        # Just above the test supervisor's 20-minute execution deadline, so the
        # supervisor reports a stall first and a wedged step cannot hold the runner for hours.
        timeout-minutes: 23
        run: bun run test

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Run OpenCode 2 E2E tests in a network-isolated container
        run: bun run test:e2e:opencode-v2

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

  rpc-runtime-matrix:
    name: RPC runtime matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Each runtime is installed in turn; its executable path is recorded
      # before the next setup step changes PATH. Bun 1.3.14 is copied aside
      # because a later setup-bun step may replace the same binary.
      - name: Setup Node.js 20.0.0
        uses: actions/setup-node@v5
        with:
          node-version: 20.0.0

      - name: Record Node.js 20.0.0
        run: echo "NODE20=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0

      - name: Record Node.js 24.16.0
        run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Record Bun 1.3.14
        run: |
          mkdir -p "$RUNNER_TEMP/bun-1.3.14"
          cp "$(command -v bun)" "$RUNNER_TEMP/bun-1.3.14/bun"
          echo "BUN13=$RUNNER_TEMP/bun-1.3.14/bun" >> "$GITHUB_ENV"

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Record Bun 1.4.2
        run: echo "BUN14=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          bun packages/opencode/scripts/embed-common-auth.ts --check
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Run RPC contracts on all four runtimes
        run: bun run test:rpc:matrix

  mutations-pr:
    name: Mutation proofs (PR diff)
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          bun packages/opencode/scripts/embed-common-auth.ts --check
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Cache pinned mutation runner
        id: mutate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CKDEV_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CKDEV_MUTATE_REV" cortexkit-mutate

      - name: Check mutation catalogue
        run: ckdev-mutate check --strict

      - name: Replay mutation proofs changed by PR
        run: |
          mkdir -p mutations-report
          ckdev-mutate run --diff origin/main --report mutations-report/diff.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutations-pr
          path: mutations-report/diff.json

  mutations-main:
    name: Mutation proofs (full catalogue)
    # Verification branches replay the full catalogue too, so a change is proven
    # before it reaches main.
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/verify/'))) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install private TUI compiler from locked repository input
        run: |
          bun packages/opencode/scripts/embed-common-auth.ts --check
          bun install --cwd tools/common-auth-build --frozen-lockfile --ignore-scripts
          bun run embed:check

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Cache pinned mutation runner
        id: mutate-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CKDEV_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CKDEV_MUTATE_REV" cortexkit-mutate

      - name: Check mutation catalogue
        run: ckdev-mutate check --strict

      - name: Replay full mutation catalogue
        env:
          BROAD: ${{ github.event_name != 'push' && 'true' || '' }}
        run: |
          mkdir -p mutations-report
          ckdev-mutate run --all ${BROAD:+--broad} --report mutations-report/all.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'mutations-main' || 'mutations-broad' }}
          path: mutations-report/all.json
